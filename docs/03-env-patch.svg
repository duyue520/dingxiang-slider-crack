<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/>
    </marker>
  </defs>
  <rect width="960" height="560" fill="#ffffff"/>
  <text x="40" y="46" font-size="24" font-weight="700" fill="#1b2733">Node 补环境引擎工作原理</text>
  <text x="40" y="72" font-size="13" fill="#7b8a99">不启动浏览器，用 jsdom 造一个最小可用环境，直接加载并驱动官方 SDK</text>
  <line x1="40" y1="86" x2="920" y2="86" stroke="#e3e8ee" stroke-width="1.5"/>

  <!-- left: what SDK needs -->
  <rect x="40" y="106" width="270" height="230" rx="10" fill="#f7fafc" stroke="#d6dee7"/>
  <text x="58" y="134" font-size="14" font-weight="700" fill="#1b2733">SDK 依赖的浏览器能力</text>
  <text x="58" y="162" font-size="12.5" fill="#4a5b6b">· document / DOM 树</text>
  <text x="58" y="186" font-size="12.5" fill="#4a5b6b">· XMLHttpRequest</text>
  <text x="58" y="210" font-size="12.5" fill="#4a5b6b">· Canvas 2D 上下文</text>
  <text x="58" y="234" font-size="12.5" fill="#4a5b6b">· Image 解码</text>
  <text x="58" y="258" font-size="12.5" fill="#4a5b6b">· navigator / screen / 存储</text>
  <text x="58" y="282" font-size="12.5" fill="#4a5b6b">· webpack chunk 动态加载</text>
  <text x="58" y="312" font-size="11.5" fill="#c0392b">Node 原生都没有 → 需要逐个补</text>

  <line x1="318" y1="221" x2="352" y2="221" stroke="#5b6b7c" stroke-width="2" marker-end="url(#a3)"/>

  <!-- middle: patches -->
  <rect x="360" y="106" width="270" height="230" rx="10" fill="#eef6ff" stroke="#bcd8f7"/>
  <text x="378" y="134" font-size="14" font-weight="700" fill="#1b2733">本项目的补丁</text>
  <text x="378" y="162" font-size="12.5" font-family="ui-monospace,Menlo,Consolas,monospace" fill="#2d7ff9">jsdom(…)</text>
  <text x="378" y="186" font-size="12" fill="#4a5b6b">提供 DOM / XHR / navigator 骨架</text>
  <text x="378" y="212" font-size="12.5" font-family="ui-monospace,Menlo,Consolas,monospace" fill="#2d7ff9">getContext() → 假 ctx</text>
  <text x="378" y="236" font-size="12" fill="#4a5b6b">返回 CanvasRenderingContext2D 形状对象</text>
  <text x="378" y="262" font-size="12.5" font-family="ui-monospace,Menlo,Consolas,monospace" fill="#2d7ff9">Image → 立即 onload</text>
  <text x="378" y="286" font-size="12" fill="#4a5b6b">绕过 jsdom 不解码 webp 的问题</text>
  <text x="378" y="312" font-size="12.5" font-family="ui-monospace,Menlo,Consolas,monospace" fill="#2d7ff9">XHR 放行（只监听不阻断）</text>

  <line x1="638" y1="221" x2="672" y2="221" stroke="#5b6b7c" stroke-width="2" marker-end="url(#a3)"/>

  <!-- right: result -->
  <rect x="680" y="106" width="240" height="230" rx="10" fill="#eefaf3" stroke="#a8dfc2"/>
  <text x="698" y="134" font-size="14" font-weight="700" fill="#1b2733">可直接调用的对象</text>
  <text x="698" y="164" font-size="12.5" font-family="ui-monospace,Menlo,Consolas,monospace" fill="#1b8a5a">window._dx.Captcha</text>
  <text x="698" y="186" font-size="12" fill="#4a5b6b">初始化滑块组件</text>
  <text x="698" y="212" font-size="12.5" font-family="ui-monospace,Menlo,Consolas,monospace" fill="#1b8a5a">window._dx.UA</text>
  <text x="698" y="234" font-size="12" fill="#4a5b6b">ac 生成器（start/app/recordSA…）</text>
  <text x="698" y="260" font-size="12.5" font-family="ui-monospace,Menlo,Consolas,monospace" fill="#1b8a5a">window._dx.ConstID</text>
  <text x="698" y="282" font-size="12" fill="#4a5b6b">Param 生成（XuRhstZ）</text>
  <text x="698" y="312" font-size="11.5" fill="#1b8a5a">→ 实测已产出真实 token</text>

  <!-- bottom flow -->
  <rect x="40" y="360" width="880" height="170" rx="10" fill="#f7fafc" stroke="#d6dee7"/>
  <text x="58" y="388" font-size="14" font-weight="700" fill="#1b2733">运行链路</text>

  <rect x="60" y="404" width="150" height="52" rx="8" fill="#fff" stroke="#d6dee7"/>
  <text x="135" y="426" font-size="12.5" font-weight="700" fill="#1b2733" text-anchor="middle">Python 客户端</text>
  <text x="135" y="444" font-size="11" fill="#7b8a99" text-anchor="middle">第1/2步纯算</text>

  <line x1="212" y1="430" x2="248" y2="430" stroke="#5b6b7c" stroke-width="2" marker-end="url(#a3)"/>

  <rect x="252" y="404" width="150" height="52" rx="8" fill="#fff" stroke="#d6dee7"/>
  <text x="327" y="426" font-size="12.5" font-weight="700" fill="#1b2733" text-anchor="middle">Node 引擎</text>
  <text x="327" y="444" font-size="11" fill="#7b8a99" text-anchor="middle">engine.cjs</text>

  <line x1="404" y1="430" x2="440" y2="430" stroke="#5b6b7c" stroke-width="2" marker-end="url(#a3)"/>

  <rect x="444" y="404" width="180" height="52" rx="8" fill="#fff" stroke="#d6dee7"/>
  <text x="534" y="426" font-size="12.5" font-weight="700" fill="#1b2733" text-anchor="middle">产出 Param / ac</text>
  <text x="534" y="444" font-size="11" fill="#7b8a99" text-anchor="middle">lid → Param → token → ac</text>

  <line x1="626" y1="430" x2="662" y2="430" stroke="#5b6b7c" stroke-width="2" marker-end="url(#a3)"/>

  <rect x="666" y="404" width="234" height="52" rx="8" fill="#eefaf3" stroke="#a8dfc2"/>
  <text x="783" y="426" font-size="12.5" font-weight="700" fill="#1b8a5a" text-anchor="middle">POST /api/v1 提交验证</text>
  <text x="783" y="444" font-size="11" fill="#4a5b6b" text-anchor="middle">返回最终 token</text>

  <text x="60" y="492" font-size="12" fill="#4a5b6b">关键点 1：必须放行真实 XHR —— 否则 SDK 拿不到 /api/a 数据，滑块不渲染、UA 不初始化。</text>
  <text x="60" y="514" font-size="12" fill="#4a5b6b">关键点 2：SDK 的 chunk publicPath 指向 cdn.dingxiang-inc.com，需重写为站点实际 CDN（chunk hash 相同即同一文件）。</text>
</svg>
